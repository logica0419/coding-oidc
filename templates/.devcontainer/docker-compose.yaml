services:
  app:
    image: "mcr.microsoft.com/devcontainers/base:bookworm"
    volumes:
      - "..:/workspaces/coding-oidc:cached"
    command: "sleep infinity"
    depends_on:
      valkey:
        condition: "service_healthy"
    environment:
      VALKEY_URL: "redis://valkey:6379"

  valkey:
    image: "valkey/valkey:9.1.2-alpine"
    ports:
      - "6379:6379"
    volumes:
      - "coding-oidc-valkey:/data"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: "5s"
      timeout: "3s"
      retries: 5

volumes:
  coding-oidc-valkey:
